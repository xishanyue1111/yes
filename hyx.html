    <script>
var canvas = document.getElementById('particles');
var ctx = canvas.getContext('2d');
var W, H, stars = [], colors = ['#f6c453', '#ffd97a', '#fff0b3'];
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
function makeStar(){
  return {
    x: Math.random()*W, y: Math.random()*H,
    r: 6 + Math.random()*10,          // 星星大小
    rot: Math.random()*6.28,          // 旋转角度
    spin: (Math.random()-.5)*0.02,    // 旋转速度
    vx: (Math.random()-.5)*0.5,       // 移动速度
    vy: (Math.random()-.5)*0.5,
    tw: Math.random()*6.28,           // 闪烁相位
    tws: 0.02 + Math.random()*0.05,   // 闪烁速度
    col: colors[Math.floor(Math.random()*colors.length)]
  };
}
function drawStar(px, py, outer, inner, rot){   // 画五角星
  ctx.beginPath();
  for(var i=0;i<5;i++){
    var a1 = rot + i*1.2566, a2 = a1 + 0.628;
    var x1 = px + Math.cos(a1)*outer, y1 = py + Math.sin(a1)*outer;
    var x2 = px + Math.cos(a2)*inner, y2 = py + Math.sin(a2)*inner;
    if(i===0) ctx.moveTo(x1,y1); else ctx.lineTo(x1,y1);
    ctx.lineTo(x2,y2);
  }
  ctx.closePath();
}
function init(n){ stars=[]; for(var i=0;i<n;i++) stars.push(makeStar()); }
function draw(){
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){
    var s = stars[i];
    s.x += s.vx; s.y += s.vy; s.rot += s.spin; s.tw += s.tws;
    if(s.x<-20) s.x=W+20; if(s.x>W+20) s.x=-20;   // 从一边消失从另一边进来
    if(s.y<-20) s.y=H+20; if(s.y>H+20) s.y=-20;
    var a = 0.35 + 0.65*Math.abs(Math.sin(s.tw));  // 闪烁（透明度变化）
    ctx.globalAlpha = a; ctx.fillStyle = s.col;
    drawStar(s.x, s.y, s.r, s.r*0.4, s.rot); ctx.fill();
  }
  requestAnimationFrame(draw);
}
resize(); init(50); draw();
window.addEventListener('resize', resize);
</script>

</body>
